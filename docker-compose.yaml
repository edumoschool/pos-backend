# Coolify deployment: pos-backend + PostgreSQL + MinIO
#
# Deploy in Coolify as: New Resource -> Docker Compose, pointing at this repo.
# The resource's "Docker Compose Location" must match this file's path and
# extension exactly: /docker-compose.yaml (Coolify does not fall back to .yml).
#
# Routing comes from Coolify's magic SERVICE_FQDN_<SERVICE>_<PORT> keys, which
# generate the Traefik config and TLS certificates — hence no traefik.* labels.
# SERVICE_USER_* / SERVICE_PASSWORD_* are credentials Coolify generates once
# and keeps stable across deploys.
#
# Set these in Coolify's UI (see DEPLOYMENT.md):
#   SERVICE_FQDN_BACKEND_7000  -> po.impulselc.uz
#   SERVICE_FQDN_MINIO_9000    -> s3.impulselc.uz
#   SERVICE_FQDN_MINIO_9001    -> minio.impulselc.uz
#   BACKEND_DOMAIN             -> po.impulselc.uz
#   MINIO_API_DOMAIN           -> s3.impulselc.uz
#   MINIO_CONSOLE_DOMAIN       -> minio.impulselc.uz
#
# The plain *_DOMAIN duplicates exist because the app needs the hostname as a
# value it can read (to build https:// URLs), and Coolify only populates the
# matching SERVICE_URL_* keys when it assigns the domain itself.
#
# Postgres publishes no ports and is reachable only on the internal network.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      # Keeps initdb from depending on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The -d/-U flags matter: without them pg_isready checks the wrong db
      # and reports healthy before the app's database actually exists.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-pos}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Both ports must be declared for Coolify to render a domain field per
    # port. Without this it only picks up the image's own EXPOSE (9000) and
    # the second domain silently reverts to a generated default.
    expose:
      - "9000"
      - "9001"
    environment:
      # Declaring these two makes Coolify route 9000 (S3 API) and 9001
      # (web console) to their own domains and issue certificates for both.
      SERVICE_FQDN_MINIO_9000:
      SERVICE_FQDN_MINIO_9001:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      # Public URLs MinIO uses when building redirects and presigned links.
      # Built from the FQDNs rather than SERVICE_URL_*, which Coolify does not
      # populate when the domains are set by hand in the UI.
      MINIO_SERVER_URL: https://${MINIO_API_DOMAIN}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
    volumes:
      - pos-minio-data:/data
    # No healthcheck override: the minio image ships neither curl nor wget nor
    # mc, so a CMD-SHELL probe fails instantly and the container is marked
    # unhealthy about a second after starting. The image defines its own
    # HEALTHCHECK against /minio/health/live, which is what we want anyway.

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "7000"
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, not service_healthy: whether the minio image defines a
      # HEALTHCHECK varies by tag, and waiting on one it may not have would
      # hang the deploy. MinioService.onModuleInit now retries, so it tolerates
      # MinIO still warming up.
      minio:
        condition: service_started
    environment:
      # Publishes port 7000 on the backend domain and generates its routing.
      SERVICE_FQDN_BACKEND_7000:
      NODE_ENV: production
      PORT: 7000

      # Both point at the same database. Prisma reads DATABASE_URL at runtime
      # via the pg adapter; prisma.config.ts reads DIRECT_URL for migrations.
      # There is no pgbouncer here, so they are identical.
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-pos}?schema=public
      DIRECT_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-pos}?schema=public

      JWT_SECRET: ${SERVICE_PASSWORD_JWT}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # Reached over the internal network, so plain HTTP on port 9000 —
      # traffic never leaves the host. The public s3. domain is for clients
      # fetching images directly.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${SERVICE_USER_MINIO}
      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
      MINIO_BUCKET: ${MINIO_BUCKET:-pos-images}

      # MinioService calls getOrThrow for the MINIO_* vars above and
      # TelegramModule does the same for the bot token: the app will not
      # boot if any of them is missing.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Telegraf needs the scheme, so this is built from the backend domain.
      TELEGRAM_WEBHOOK_DOMAIN: https://${BACKEND_DOMAIN}

      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

volumes:
  pos-postgres-data:
  pos-minio-data:
